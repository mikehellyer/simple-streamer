[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-streamer"
version = "0.3.4"
description = "A simple internet radio and podcast player"
authors = [{ name = "Mike Hellyer" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "platformdirs",
    "certifi",
    "numpy",
]

[project.scripts]
simple-streamer = "simple_streamer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simple_streamer.gui" = ["resources/*.png"]
