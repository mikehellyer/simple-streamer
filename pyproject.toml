[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-streamer"
version = "0.1.0"
description = "A simple internet radio and podcast player"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "platformdirs",
]

[project.scripts]
simple-streamer = "simple_streamer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
