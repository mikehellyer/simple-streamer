name: Tests

on:
  push:
  pull_request:

# Actions are pinned to exact commits (tag in the comment) so a moved or
# hijacked tag can't change what runs in this pipeline. Jobs get
# read-only access to the repository unless they say otherwise.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Pinned to match the release build (see release.yml).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: pytest
