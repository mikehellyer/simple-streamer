name: Release

on:
  push:
    tags:
      - "v*"

# Actions are pinned to exact commits (tag in the comment) so a moved or
# hijacked tag can't change what runs in this pipeline. Jobs get
# read-only access to the repository unless they say otherwise.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned, not ubuntu-latest: the app bundles the build
        # machine's libraries, so it only runs on systems at least as new.
        # 24.04 matches Pop!_OS 24.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/pyinstaller/simple-streamer.spec

      - name: Check it runs on Ubuntu / Pop!_OS 24.04
        if: runner.os == 'Linux'
        run: bash packaging/linux/check-glibc.sh dist/Simple-Streamer 2.39

      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh

      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\installer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-streamer-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
